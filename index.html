<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdeaf0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#241a22" media="(prefers-color-scheme: dark)">
<title>쨈하니 사랑해</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #fff4f7; --bg2: #fbe3ec;
    --ink: #c8496f; --soft: #e48aa8; --mute: #c8496f80;
    --h1: #ff9fbd; --h2: #f2668f; --glow: #f2668f40;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #2d2029; --bg2: #1f161d;
      --ink: #f4b3c8; --soft: #e48aa8; --mute: #f4b3c880;
      --h1: #f08aaa; --h2: #d9567f; --glow: #d9567f33;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    min-height: 100dvh; display: grid; place-items: center; overflow: hidden;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    background: radial-gradient(120% 90% at 50% 30%, var(--bg1), var(--bg2));
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
    color: var(--ink); touch-action: manipulation;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 28px; margin-top: -6vh; }

  .heart-btn {
    appearance: none; border: 0; background: none; padding: 18px; cursor: pointer; border-radius: 50%;
    animation: rise 1s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .heart-btn svg {
    width: min(46vw, 190px); height: auto; display: block; overflow: visible;
    filter: drop-shadow(0 14px 22px var(--glow));
    animation: beat 3.2s ease-in-out infinite; transform-origin: 50% 60%;
  }
  .heart-btn.tap svg { animation: squish .45s cubic-bezier(.3,1.6,.5,1); }
  .heart-btn:focus-visible { outline: 2px solid var(--soft); outline-offset: 4px; }

  h1 {
    margin: 0; font-weight: 400; text-align: center; letter-spacing: .02em;
    font-size: clamp(2rem, 9.5vw, 3.2rem); color: var(--ink); line-height: 1.25;
    animation: rise 1s .25s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .hint {
    margin: 0; font-size: .95rem; color: var(--mute); transition: opacity .6s;
    animation: rise 1s .5s cubic-bezier(.2,.8,.2,1) backwards;
  }
  .hint.gone { opacity: 0; }

  .mini { position: fixed; width: 22px; height: 22px; pointer-events: none; z-index: 5; left: 0; top: 0;
    animation: fly 1.4s cubic-bezier(.2,.7,.3,1) both; }
  .mini svg { width: 100%; height: 100%; display: block; }
  .dust { position: fixed; border-radius: 50%; pointer-events: none; background: var(--soft); opacity: 0;
    animation: drift linear infinite; }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes beat { 0%,100% { transform: scale(1); } 12% { transform: scale(1.06); } 24% { transform: scale(1); } 36% { transform: scale(1.04); } 48% { transform: scale(1); } }
  @keyframes squish { 0% { transform: scale(1); } 35% { transform: scale(.88, .84); } 100% { transform: scale(1); } }
  @keyframes fly {
    0% { transform: translate(var(--x), var(--y)) scale(.4); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translate(calc(var(--x) + var(--dx)), calc(var(--y) - 190px)) scale(var(--s)) rotate(var(--r)); opacity: 0; }
  }
  @keyframes drift { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .35; } 100% { transform: translateY(-30vh); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .dust { display: none; }
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--h1)"/><stop offset="1" stop-color="var(--h2)"/>
      </linearGradient>
      <path id="hp" d="M50 88C20 68 6 50 6 32 6 18 17 8 30 8c8 0 15 4 20 11C55 12 62 8 70 8c13 0 24 10 24 24 0 18-14 36-44 56z"/>
    </defs>
  </svg>

  <label id="haptic" aria-hidden="true" style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden"><input type="checkbox" switch tabindex="-1"></label>

  <main>
    <button class="heart-btn" id="heart" aria-label="쨈하니 사랑해">
      <svg viewBox="0 0 100 96" aria-hidden="true">
        <use href="#hp" fill="url(#g)"/>
        <ellipse cx="29" cy="26" rx="9" ry="5.5" fill="#fff" opacity=".45" transform="rotate(-30 29 26)"/>
      </svg>
    </button>
    <h1>쨈하니<br>사랑해</h1>
    <p class="hint" id="hint">하트를 톡 눌러봐</p>
  </main>

<script>
  const heart = document.getElementById("heart"), hint = document.getElementById("hint");
  const calm = !matchMedia("(prefers-reduced-motion: reduce)").matches;
  let taps = 0;

  function spawn(x, y) {
    for (let i = 0; i < 5; i++) {
      const el = document.createElement("div");
      el.className = "mini";
      el.innerHTML = '<svg viewBox="0 0 100 96"><use href="#hp" fill="url(#g)"/></svg>';
      el.style.setProperty("--x", x - 11 + (Math.random() * 40 - 20) + "px");
      el.style.setProperty("--y", y - 11 + "px");
      el.style.setProperty("--dx", Math.random() * 90 - 45 + "px");
      el.style.setProperty("--s", 0.8 + Math.random() * 0.9);
      el.style.setProperty("--r", Math.random() * 50 - 25 + "deg");
      el.style.animationDelay = i * 60 + "ms";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1600);
    }
  }

  heart.addEventListener("pointerdown", (e) => {
    heart.classList.remove("tap"); void heart.offsetWidth; heart.classList.add("tap");
    if (++taps === 1) hint.classList.add("gone");
    if (calm) spawn(e.clientX, e.clientY);
  });
  // 진동은 click(사용자 활성화가 인정되는 시점)에서. iOS는 vibrate 미지원이라 switch 체크박스 햅틱으로 대체
  const haptic = document.getElementById("haptic");
  heart.addEventListener("click", () => {
    if (navigator.vibrate) navigator.vibrate(15);
    else if (haptic) haptic.click();
  });
  // 하트 밖을 눌러도 작은 하트가 올라옴
  document.body.addEventListener("pointerdown", (e) => {
    if (calm && !heart.contains(e.target)) spawn(e.clientX, e.clientY);
  });

  // 은은한 먼지 입자
  if (calm) for (let i = 0; i < 14; i++) {
    const d = document.createElement("div"), s = 3 + Math.random() * 5;
    d.className = "dust";
    d.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}vw;top:${50 + Math.random() * 50}vh;` +
      `animation-duration:${9 + Math.random() * 8}s;animation-delay:${-Math.random() * 14}s`;
    document.body.appendChild(d);
  }
</script>
</body>
</html>
