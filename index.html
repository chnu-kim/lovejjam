<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쨈하니 사랑해</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background: linear-gradient(160deg, #fde4ee, #fff3f7 45%, #efe6fb);
    font-family: "Gowun Batang", "Noto Serif KR", serif;
  }
  h1 {
    position: relative; z-index: 2; margin: 0; padding: 0 16px; text-align: center;
    font-size: clamp(2.4rem, 11vw, 5.2rem); font-weight: 700; letter-spacing: .04em; color: #fff;
    text-shadow: 0 0 10px #ff8fb8, 0 0 26px #ff8fb8, 0 0 54px #ffb3cf;
    animation: in 1.6s ease both, glow 4s ease-in-out 1.6s infinite;
  }
  .bokeh {
    position: fixed; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, #fff 0%, #ffffff00 70%);
    animation: drift linear infinite; opacity: 0;
  }
  @keyframes in { from { opacity: 0; transform: translateY(14px); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  @keyframes glow { 0%,100% { text-shadow: 0 0 10px #ff8fb8, 0 0 26px #ff8fb8, 0 0 54px #ffb3cf; }
                    50% { text-shadow: 0 0 14px #ff7aa9, 0 0 36px #ff8fb8, 0 0 70px #ffb3cf; } }
  @keyframes drift {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: .9; }
    100% { transform: translateY(-40vh); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .bokeh { display: none; } }
</style>
</head>
<body>
  <h1>쨈하니 사랑해</h1>
<script>
  const tints = ["#fff", "#ffd1e3", "#f1e4ff", "#fff0b8"];
  for (let i = 0; i < 28; i++) {
    const el = document.createElement("div");
    const s = 20 + Math.random() * 70;
    el.className = "bokeh";
    el.style.cssText = `width:${s}px;height:${s}px;left:${Math.random() * 100}vw;top:${40 + Math.random() * 60}vh;` +
      `animation-duration:${7 + Math.random() * 8}s;animation-delay:${-Math.random() * 12}s;` +
      `background:radial-gradient(circle,${tints[i % tints.length]} 0%,#ffffff00 70%)`;
    document.body.appendChild(el);
  }
</script>
</body>
</html>
